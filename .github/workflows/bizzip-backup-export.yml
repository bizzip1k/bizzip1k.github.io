name: BIZZIP Backup Export

on:
  push:
    branches:
      - backup-export-temp-20261008

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          ref: 7812dec01ab13b2df091a2ddbfb4af2b60680882
          fetch-depth: 1

      - name: Rebuild exact files from Git blobs and verify
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, hashlib, os, subprocess, zipfile
          from pathlib import Path

          commit="7812dec01ab13b2df091a2ddbfb4af2b60680882"
          repo="bizzip1k/bizzip1k.github.io"
          raw_root=Path("/tmp/bizzip_raw")
          info_root=Path("/tmp/bizzip_info")
          raw_root.mkdir(parents=True,exist_ok=True)
          info_root.mkdir(parents=True,exist_ok=True)

          tree=subprocess.check_output(["git","ls-tree","-r","-z",commit])
          entries=[]
          for rec in tree.split(b"\0"):
              if not rec:
                  continue
              meta,path_b=rec.split(b"\t",1)
              mode,typ,sha=meta.decode().split()
              if typ!="blob":
                  continue
              path=path_b.decode("utf-8")
              entries.append((mode,path,sha))

          rows=[]
          ok=0
          for mode,path,sha in entries:
              data=subprocess.check_output(["git","cat-file","blob",sha])
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              target=raw_root/path
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              if mode=="100755":
                  target.chmod(0o755)
              status="OK" if actual==sha else "MISMATCH"
              if status=="OK":
                  ok+=1
              rows.append((path,len(data),len(data),sha,actual,status,mode))

          manifest=info_root/"BIZZIP_FILE_MANIFEST.csv"
          with manifest.open("w",newline="",encoding="utf-8-sig") as f:
              w=csv.writer(f)
              w.writerow(["path","github_size","backup_size","github_blob_sha","backup_blob_sha","status","git_mode"])
              w.writerows(rows)

          report=[
              "BIZZIP BACKUP VERIFICATION REPORT",
              "================================",
              f"Repository: {repo}",
              f"Commit: {commit}",
              f"Expected tracked files: {len(entries)}",
              f"Verified OK: {ok}",
              f"Mismatch/Missing: {len(entries)-ok}",
              "",
              "RESULT: "+("PASS" if ok==len(entries) else "FAIL"),
              "",
              "Verification method:",
              "- Every file reconstructed directly from git cat-file blob.",
              "- Git blob SHA recomputed from reconstructed bytes.",
              "- File count, byte size and blob SHA verified individually."
          ]
          (info_root/"BIZZIP_VERIFICATION_REPORT.txt").write_text("\n".join(report)+"\n",encoding="utf-8")
          (info_root/"README_BACKUP.txt").write_text(
              "BIZZIP 1차 오픈 최종 검증 백업\n"
              f"Repository: {repo}\n"
              f"Commit: {commit}\n"
              f"Verified files: {ok}/{len(entries)}\n\n"
              "BIZZIP_GITHUB_RAW ZIP은 해당 커밋의 Git 추적 파일만 포함합니다.\n"
              "BIZZIP_VERIFIED_BACKUP ZIP은 site/ 아래 동일 파일과 __BACKUP_INFO__/ 검증자료를 포함합니다.\n",
              encoding="utf-8"
          )

          if ok!=len(entries):
              raise SystemExit("Verification failed")

          raw_zip=Path("BIZZIP_GITHUB_RAW_2026-10-08_7812dec.zip")
          verified_zip=Path("BIZZIP_VERIFIED_BACKUP_2026-10-08_7812dec.zip")

          def add_bytes(z,path,data,mode=0o644):
              zi=zipfile.ZipInfo(path)
              zi.compress_type=zipfile.ZIP_DEFLATED
              zi.external_attr=(mode & 0xFFFF)<<16
              z.writestr(zi,data)

          with zipfile.ZipFile(raw_zip,"w") as z:
              for mode,path,sha in entries:
                  data=(raw_root/path).read_bytes()
                  add_bytes(z,path,data,0o755 if mode=="100755" else 0o644)

          with zipfile.ZipFile(verified_zip,"w") as z:
              for mode,path,sha in entries:
                  data=(raw_root/path).read_bytes()
                  add_bytes(z,"site/"+path,data,0o755 if mode=="100755" else 0o644)
              for name in ["BIZZIP_FILE_MANIFEST.csv","BIZZIP_VERIFICATION_REPORT.txt","README_BACKUP.txt"]:
                  add_bytes(z,"__BACKUP_INFO__/"+name,(info_root/name).read_bytes())

          print("\n".join(report))
          print("RAW ZIP:",raw_zip.stat().st_size)
          print("VERIFIED ZIP:",verified_zip.stat().st_size)
          PY

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIZZIP_FINAL_BACKUPS_2026-10-08_7812dec
          path: |
            BIZZIP_GITHUB_RAW_2026-10-08_7812dec.zip
            BIZZIP_VERIFIED_BACKUP_2026-10-08_7812dec.zip
            /tmp/bizzip_info/BIZZIP_FILE_MANIFEST.csv
            /tmp/bizzip_info/BIZZIP_VERIFICATION_REPORT.txt
          if-no-files-found: error
          retention-days: 7

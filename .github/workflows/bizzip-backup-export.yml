name: BIZZIP Backup Export

on:
  push:
    branches:
      - backup-export-temp-20261008

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact first-open snapshot
        uses: actions/checkout@v4
        with:
          ref: 7812dec01ab13b2df091a2ddbfb4af2b60680882
          fetch-depth: 1

      - name: Verify every tracked file against Git blob SHA
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, os, subprocess, sys
          commit="7812dec01ab13b2df091a2ddbfb4af2b60680882"
          raw=subprocess.check_output(["git","ls-tree","-r","-l",commit], text=True)
          expected=[]
          for line in raw.splitlines():
              meta,path=line.split("\t",1)
              mode,typ,sha,size=meta.split()
              if typ=="blob":
                  expected.append((path,sha,int(size)))
          rows=[]
          ok=0
          for path,sha,size in expected:
              actual_size=os.path.getsize(path) if os.path.isfile(path) else -1
              actual_sha=subprocess.check_output(["git","hash-object",path], text=True).strip() if os.path.isfile(path) else ""
              status="OK" if actual_sha==sha and actual_size==size else ("MISSING" if actual_size<0 else "MISMATCH")
              if status=="OK":
                  ok+=1
              rows.append((path,size,actual_size,sha,actual_sha,status))
          with open("BIZZIP_FILE_MANIFEST.csv","w",newline="",encoding="utf-8-sig") as f:
              w=csv.writer(f)
              w.writerow(["path","github_size","backup_size","github_blob_sha","backup_blob_sha","status"])
              w.writerows(rows)
          report=[
              "BIZZIP BACKUP VERIFICATION REPORT",
              "================================",
              "Repository: bizzip1k/bizzip1k.github.io",
              f"Commit: {commit}",
              f"Expected tracked files: {len(expected)}",
              f"Verified OK: {ok}",
              f"Mismatch/Missing: {len(expected)-ok}",
              "",
              "RESULT: "+("PASS" if ok==len(expected) else "FAIL"),
              "",
              "Verification method:",
              "- Expected SHA and size: git ls-tree -r -l <commit>",
              "- Backup SHA: git hash-object <file>",
              "- Every tracked blob compared individually."
          ]
          open("BIZZIP_VERIFICATION_REPORT.txt","w",encoding="utf-8").write("\n".join(report)+"\n")
          print("\n".join(report))
          if ok != len(expected):
              sys.exit(1)
          PY

      - name: Create exact GitHub snapshot ZIP
        run: |
          zip -r BIZZIP_GITHUB_RAW_2026-10-08_7812dec.zip . -x '.git/*' 'BIZZIP_FILE_MANIFEST.csv' 'BIZZIP_VERIFICATION_REPORT.txt'

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIZZIP_VERIFICATION_2026-10-08_7812dec
          path: |
            BIZZIP_GITHUB_RAW_2026-10-08_7812dec.zip
            BIZZIP_FILE_MANIFEST.csv
            BIZZIP_VERIFICATION_REPORT.txt
          if-no-files-found: error
          retention-days: 7
